name: hr_odoo_app
description: تطبيق HR متكامل (حضور، إجازات، رواتب، موافقات) مرتبط مباشرة بـ Odoo Enterprise عبر JSON-RPC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
