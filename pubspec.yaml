name: hr_odoo_app
description: تطبيق HR الاجتهاد - حضور، إجازات، رواتب وموافقات، مرتبط مباشرة بـ Odoo. تطوير المهندس مصطفى ارخيص.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  intl: ^0.20.3
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#009688"
