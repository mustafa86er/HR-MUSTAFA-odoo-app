workflows:
  android-employees:
    name: HR App - Android (Firebase App Distribution)
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable
      groups:
        - firebase_credentials   # مجموعة متغيرات تُنشأ من إعدادات Codemagic (خطوة 4 في التعليمات)
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - employees
